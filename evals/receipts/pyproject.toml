[project]
name = "checksplit-receipt-eval"
version = "0.1.0"
description = "Standalone offline receipt extraction smoke evaluation"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "json5>=0.12,<0.13", "jsonschema[format]>=4.25,<5"]

[project.scripts]
receipt-eval = "receipt_eval.runner:cli"

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["receipt_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
